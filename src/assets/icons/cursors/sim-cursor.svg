<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The hand of the palette's simulation icon, redrawn for a cursor: pale body,
       contrasting outline, hotspot on the tallest fingertip as a pointing hand.

       The fingers share their edges, and a drawn line separates them rather than
       a notch: one stroke of accent between two whites, with no canvas showing
       through. Above the knuckles that line is the silhouette itself, since the
       fingers are of unequal heights; below, it is drawn on its own. -->

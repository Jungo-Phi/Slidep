             C8.5 26 6 24 5 20
             C4 16 5.5 14.8 7 15
             C9 15 10.5 20.5 10.5 19
             L10.5 9.5
             C10.5 9.5 11 7.5 12.8 7.5
             C14.7 7.5 15.3 9.5 15.3 9.5
             L15.3 6
             C15.3 5.5 15.9 4 17.6 4
             C19.2 4 20 5.5 20 6
             L20 10.5
             C20 10 20.8 8.5 22.2 8.5
             C24 8.5 24.5 10 24.5 10.5
             Z"
          fill="#ffffff"/>
